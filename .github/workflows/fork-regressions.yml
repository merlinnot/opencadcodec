name: Fork regressions

on:
  push:
    branches: [hombee/integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ref:
          - fix/preserve-native-records
          - fix/dynamic-block-codecs
          - fix/evaluation-graph-ownership
          - fix/evaluated-block-metadata
          - fix/preserve-legacy-class-ids
          - hombee/integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Test the independent branch
        run: cargo test --lib --tests --features serde
      - name: Check WebAssembly compilation
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --lib --target wasm32-unknown-unknown
